<!DOCTYPE html>
<html>
<head>
<style>
  /* Internal CSS */
  table { width: 100%; border-collapse: collapse; }
  th { background-color: #f2f2f2; padding: 10px; }
  td { border: 1px solid black; padding: 8px; }
  .special-row { background-color: yellow; } /* Modifies at least one row */
</style>
</head>
<body>

<table>
  <tr>
    <th>Time</th>
    <th>Event</th>
  </tr>
  <tr>
    <td>8:00 AM</td>
    <td>Breakfast</td>
  </tr>
  <!-- Add 7 more rows here -->
  <tr class="special-row">
    <td>12:00 PM</td>
    <td>Lunch Break</td>
  </tr>
</table>

</body>
</html>
