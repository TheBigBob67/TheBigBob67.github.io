<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activity B: Image Replication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="project-container">
        <!-- Seagull Project -->
        <div class="project-item seagull">
            <img src="seagull.png" alt="Seagull">
        </div>

        <!-- Penguins Project -->
        <div class="project-item penguins">
            <img src="penguins.png" alt="Penguins">
        </div>

        <!-- Tic-Tac-Toe Project (Requires Absolute Positioning) -->
        <div class="project-item football-grid">
            <img src="football_field.jpg" alt="Football Field">
            <div class="overlay">
                <!-- Grid of X and O characters -->
                <div class="row"><span>X</span><span>O</span><span>O</span><span>O</span><span>O</span><span>X</span></div>
                <!-- Add more rows to match the image -->
            </div>
        </div>

        <!-- Butterfly Project -->
        <div class="project-item butterfly">
            <img src="butterfly.png" alt="Butterfly">
        </div>

        <!-- Dinosaur Project -->
        <div class="project-item dinosaur">
            <img src="dino.png" alt="Dinosaur">
        </div>

        <!-- Presenting Logo Project -->
        <div class="project-item presenting">
            <img src="logo.png" alt="Presenting Logo">
        </div>
    </div>
</body>
</html>
