<!DOCTYPE html>
<html lang="en">
<head>
  <meta charest="UTF-8">
  <title>Simple Math Test</title>
</head>
<body>
  
  <!--Start of the test -->
  <h1>Online Math Quiz</h1>

  <form>
    <!-- Name Input -->
    <p>
      <label for="username">Name:</label>
      <input type="text" id="username" name="username" required>
    </p>

    <!-- Multiple Choice Question 1 -->
    <fieldset>
      <legend>1. What is the value of 5 &times; 5?</legend>
      <input type="radio" id="q1a" name="q1" value="10">
      <label for="q1a">10</label><br>
      <input type="radio" id="q1b" name="q1" value="25">
      <label for="q1b">25</label><br>
      <input type="radio" id="q1c" name="q1" value="50">
      <label for="q1c">50</label>
    </fieldset>

    <!-- Multiple Choice Question 2 -->
    <fieldset>
      <legend>2. Solve for x: 10 &divide; 2 = x</legend>
      <input type="radio" id="q2a" name="q2" value="2">
      <label for="q2a">2</label><br>
      <input type="radio" id="q2b" name="q2" value="5">
      <label for="q2b">5</label><br>
      <input type="radio" id="q2c" name="q2" value="8">
      <label for="q2c">8</label>
    </fieldset>

    <!-- Multiple Choice Question 3 -->
    <fieldset>
      <legend>3. Which symbol represents "Greater than or Equal to"?</legend>
      <input type="radio" id="q3a" name="q3" value="gt">
      <label for="q3a">&gt;</label><br>
      <input type="radio" id="q3b" name="q3" value="ge">
      <label for="q3b">&ge;</label><br>
      <input type="radio" id="q3c" name="q3" value="lt">
      <label for="q3c">&lt;</label>
    </fieldset>

    <!-- Word Problem with Multiline Text Area -->
    <p>
      <label for="wordprob">4. Explain how to find the area of a rectangle:</label><br>
      <textarea id="wordprob" name="wordprob" rows="4" cols="50"></textarea>
    </p>

    <!-- Submit Button -->
    <button type="sumbit">Submit Test</button>
    
  </form>
  <!-- End of the test -->
</body>
</html>
