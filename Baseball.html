<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Baseball Scorecard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Baseball Box Score</h1>
    <table>
        <thead>
            <tr>
                <th>Inning</th>
                <th>Home Team</th>
                <th>Away Team</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>1</td><td>0</td><td>2</td></tr>
            <tr><td>2</td><td>1</td><td>0</td></tr>
            <tr><td>3</td><td>0</td><td>0</td></tr>
            <tr><td>4</td><td>3</td><td>1</td></tr>
        </tbody>
    </table>
</body>
</html>
