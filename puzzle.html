<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Puzzle Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="grid-layout">
        <!-- Section 1: Identification -->
        <header class="grid-section">
            <h1>Student Name: [Your Name Here]</h1>
            <p>Date: April 23, 2026</p>
        </header>

        <!-- Section 2: Puzzle Name -->
        <section class="grid-section">
            <h2>Puzzle Choice: [Butterflies/Snowmen/Fish]</h2>
        </section>

        <!-- Section 3: Flex Puzzle Area -->
        <main class="grid-section puzzle-area">
            <div class="flex-container">
                <img src="puzzle1_A.jpg" alt="Piece A">
                <img src="puzzle1_/B.jpg" alt="Piece B">
                <img src="puzzle1_/C.jpg" alt="Piece C">
                <img src="puzzle1_/D.jpg" alt="Piece D">
                <img src="puzzle1_/E.jpg" alt="Piece E">
                <img src="puzzle1_/F.jpg" alt="Piece F">
                <img src="puzzle1_G.jpg" alt="Piece G">
                <img src="puzzle1_H.jpg" alt="Piece H">
                <img src="puzzle1_I.jpg" alt="Piece I">
                <img src="puzzle1_J.jpg" alt="Piece J">
                <img src="puzzle1_K.jpg" alt="Piece K">
                <img src="puzzle1_L.jpg" alt="Piece L">
                <img src="puzzle1_M.jpg" alt="Piece M">
                
                <!-- Extra piece hidden per assignment requirements -->
                <img src="images/n.jpg" class="faulty-piece" alt="Extra Piece n">
            </div>
        </main>
    </div>

</body>
</html>
